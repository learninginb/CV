  - title: 智慧园区物联管理平台
    duration: 2020年09月 - 2021年12月
    detail: " 业务中台定位，包含开发脚手架，api网关，服务治理，用户管理，认证授权，多身份源治理等模块。支持微服务和单体式架构。开发脚手架中包含代码生成，orm，日志收集，多级缓存，事件总线，参数校验，数据聚合裁剪，树形数据结构，api同步，服务注册等多个通用功能，方便业务开发快速启项目。支持组织内部超10个标准项目，上百个交付项目。<br /> 使用SpringBoot，SpringCloudGateway，Oauth2，Redis，Postgresql，nacos等技术。 <br /> 后端开发共2人，本人负责开发脚手架，api网关，用户管理的开发。 "
- type: projects2
  name: 项目
  - title: 智慧取餐柜
    duration: 2020年07月 - 2021年8月
    detail: " 给KFC定制化开发，类似快递柜一样的取餐柜，外卖员存餐，用户取餐，会放到公寓或写字楼一层。至今仍在使用，有上百个柜子，工作日有上万个订单。有用户管理，取餐柜管理，运营统计等功能。<br />   使用SpringBoot，Postgresql，docker等技术 <br /> 本人负责后端开发和运维。 "
  - title: 化工仿真平台
    duration: 2017年04月 - 2020年5月
    detail: " 化工仿真培训以及事故分析平台，包含化工流程组态和化工流程仿真，用户可上传算法jar包，使用图形组模方式将算法串联起来，可多用户同时进行动态仿真。 <br /> springMVC架构，使用redis实时数据，websocket与第三方通讯。<br />实验室2017年到2020年的7个科研横向项目全都基于此平台。现在(2022年)仍在使用。 <br /> 共3人开发，本人全程参与做了三年。"
